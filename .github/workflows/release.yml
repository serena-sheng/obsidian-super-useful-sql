# Creates a GitHub release with the plugin assets Obsidian expects, when a version tag is pushed.
# Tag format: 0.2.0  (must match the "version" field in manifest.json)
#
# NOTE: untested in this repository. Review before relying on it.

name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "Tag $tag does not match manifest version $ver"; exit 1
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
